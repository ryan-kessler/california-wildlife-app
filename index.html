:root {
  /* colour: one meaning each */
  --ground: #fbfbf8;        /* plate paper */
  --panel: #f3f1ea;         /* recessed strip: header, table heads */
  --ink: #1f1e1b;           /* text */
  --ink-2: #55524b;         /* secondary text (7:1 on ground) */
  --rule: #d9d4c4;          /* hairline plate rules */
  --rule-strong: #b9b29d;
  --rate: #3f7d3a;          /* field green = rate, nothing else */
  --rate-strong: #2c5f28;
  --rate-proxy: #a8c9a1;
  --banner-ground: #fff4cf; /* the sample-data banner: a pale warning yellow */
  --banner-rule: #e3cf8a;
  --banner-ink: #4d3d0c;
  --land-hover: #e4dfcf;    /* a county under the pointer on the statewide map */
  --ink-hover: #3a3833;     /* a primary button under the pointer */
  --sea-rule: #b9ccdc;      /* the hairline of sea-coloured controls (Directions) */
  --kind-national-tint: rgba(90, 79, 163, 0.16);
  --kind-state-tint: rgba(176, 66, 109, 0.14);    /* a proxy rate (observer-days): the pale fill, edged in field green */   /* the selected rate mark (a bar or week in the chosen month) */
  --earth: #7a5c33;         /* plate numbers, place trail (5.6:1) */
  --kind-national: #5a4fa3;  /* site type: national parks and monuments */
  --kind-state: #b0426d;     /* site type: state parks */
  --kind-federal: #8a857a;   /* site type: federal public land (recedes) */
  --sea: #2a5a80;           /* water, links, focus */
  --sea-tint: #e3ecf3;
  --land: #efece2;
  --alert: #8f3520;         /* errors, withheld */
  --hatch: repeating-linear-gradient(135deg, #8a857a 0 1.5px, transparent 1.5px 5px);

  /* type */
  --font-text: "Atkinson Next", -apple-system, "Helvetica Neue", sans-serif;
  --font-figure: "Atkinson Mono", ui-monospace, "SF Mono", monospace;
  --size-axis: 9px;         /* month initials under mini strips */
  --size-fine: 11px;        /* map attribution */
  --size-xs: 0.78rem;
  --size-s: 0.875rem;
  --size-m: 1rem;
  --size-l: 1.25rem;
  --size-xl: 1.9rem;

  /* space: 4-based rhythm */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --radius: 3px;
  --touch: 44px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
</style>
<style>

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); color: var(--ink); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font: var(--size-m)/1.45 var(--font-text); font-variant-numeric: tabular-nums;
  min-height: 100vh; min-height: 100dvh;
}
::selection { background: var(--sea-tint); color: var(--ink); }
a { color: var(--sea); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; border-radius: var(--radius); }
button { font: inherit; color: inherit; }
.figure, .num { font-family: var(--font-figure); font-variant-numeric: tabular-nums; }
.icon { flex: none; vertical-align: -2px; }
.icon path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- sample banner ---------- */
.sample-banner {
  background: var(--banner-ground); border-bottom: 1px solid var(--banner-rule); color: var(--banner-ink);
  padding: var(--s2) var(--s4); font-size: var(--size-s);
}

/* ---------- shell header ---------- */
.shell-header {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4);
  padding: var(--s2) var(--s4); background: var(--panel); border-bottom: 1px solid var(--rule);
}
.back {
  display: inline-flex; align-items: center; gap: 2px;
  min-height: var(--touch); min-width: var(--touch); padding: 0 var(--s3);
  border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground);
  cursor: pointer;
}
.back[hidden] { display: none; }
.skip-link { position: absolute; left: -9999px; display: inline-flex; align-items: center; min-height: var(--touch); margin-bottom: var(--s2); padding: 0 var(--s3); border: 1px solid var(--ink); border-radius: var(--radius); background: var(--ground); }
.skip-link:focus { position: static; }
.back:disabled { color: var(--ink-2); border-color: var(--rule); background: transparent; cursor: default; }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1); font-size: var(--size-s); color: var(--earth); }
.trail a, .trail span { padding: var(--s1) 0; }
.trail a { color: var(--earth); }
.trail .here { color: var(--ink); font-weight: 650; }
.trail .sep { display: inline-flex; color: var(--ink-2); }

.time-toggle { display: none; }
.time-close { display: none; }
.time { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius); overflow: hidden; }
.seg button {
  min-height: 36px; padding: 0 var(--s3); border: 0; background: var(--ground); cursor: pointer;
  font-size: var(--size-s);
}
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.months { display: inline-flex; gap: 2px; }
.months button {
  min-width: 38px; min-height: 36px; padding: 0 var(--s1); border: 1px solid var(--rule);
  border-radius: var(--radius); background: var(--ground); cursor: pointer; font-size: var(--size-xs);
  font-family: var(--font-figure);
}
.months button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }

/* ---------- views ---------- */
main { padding: var(--s5) var(--s4) var(--s7); max-width: 1440px; margin: 0 auto; }
/* Map pages use the whole width: on a wide screen the map grows and the list column keeps its
   size (owner, 2026-09-29). Text-heavy pages (trips, field) keep the cap. */
main.view-landing, main.view-place, main.view-plate { max-width: none; }
@media (min-width: 1025px) {
  /* The statewide map is taller than wide, so on a wide screen the window's height limits it;
     its frame hugs the map (zoom controls beside it) and is centred in the column. */
  .landing-map .zoomable, .plate-map .zoomable { width: fit-content; max-width: 100%; margin-inline: auto; }
  .landing-map .statemap { width: auto; height: calc(100vh - 170px); max-width: 100%; }
  .plate-map .statemap { width: auto; height: calc(100vh - var(--header-h, 120px) - 110px); max-width: 100%; }
}
:root { --side-col: clamp(22rem, 38vw, 36rem); }
.plate-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s4); margin-bottom: var(--s4); }
.plate-no { font: 600 0.62em/1 var(--font-figure); color: var(--earth); margin-right: 0.45em; white-space: nowrap; }
h1 { margin: 0; font-size: var(--size-xl); line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sci { font-style: italic; color: var(--ink-2); }
.placeholder { color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: var(--s4); max-width: 32em; overflow-wrap: anywhere; }

/* ---------- error state ---------- */
.error-state { max-width: 32em; margin: var(--s7) auto; padding: var(--s5); border-top: 3px solid var(--alert); }
.error-state h1 { font-size: var(--size-l); margin-bottom: var(--s3); }

/* month turn: the signature interaction */
@media (prefers-reduced-motion: no-preference) {
  .month-turn { animation: month-turn 360ms var(--ease-out); }
  @keyframes month-turn { from { opacity: 0.35; filter: blur(1.5px); } to { opacity: 1; filter: none; } }
}

@media (max-width: 720px) {
  .shell-header { padding: var(--s2) var(--s4); }
  .time { margin-left: 0; width: 100%; }
  .months { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .months button { min-width: var(--touch); min-height: var(--touch); }
  main { padding: var(--s4) var(--s4) var(--s7); }
}

/* ---------- landing ---------- */
h2 { font-size: var(--size-m); font-weight: 700; margin: 0 0 var(--s2); }
.landing { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-col); gap: var(--s6); align-items: start; }
.statemap { width: 100%; height: auto; max-height: calc(100vh - 170px); display: block; }
.statemap .land { fill: var(--land); stroke: var(--rule-strong); stroke-width: 0.6; cursor: pointer; transition: fill 160ms var(--ease-out); }
.statemap .land:hover, .statemap .land:focus-visible { fill: var(--land-hover); outline: none; }
.statemap .sea { fill: var(--sea-tint); stroke: none; }
.statemap .mark, .legend-statemap .mark { fill: var(--rate); stroke: var(--ground); stroke-width: 0.6; cursor: pointer; }
.statemap .mark.marine, .legend-statemap .mark.marine { stroke: var(--sea); stroke-width: 0.9; }
/* Places only (no species list chosen): ink-2, never green, which means rate. */
.statemap .mark.place, .legend-statemap .mark.place { fill: var(--ink-2); fill-opacity: 0.55; stroke: var(--ground); stroke-width: 0.5; }
.statemap .mark.empty, .legend-statemap .mark.empty { fill: var(--ground); stroke: #8a857a; stroke-width: 0.7; stroke-dasharray: 1.2 1; }
.statemap .mark:hover { stroke: var(--ink); stroke-width: 1.2; }
.legend { font-size: var(--size-xs); color: var(--ink-2); margin: var(--s2) 0 0; max-width: 35em; }
.data-note { margin-top: var(--s4); font-size: var(--size-xs); color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: var(--s2); }
.data-note summary { cursor: pointer; min-height: 28px; }
.hidden-records { border-top: 1px solid var(--rule); padding-top: var(--s2); font-size: var(--size-s); color: var(--ink-2); }
.hidden-records summary { display: inline-flex; align-items: center; gap: var(--s2); list-style: none; font-size: var(--size-s); color: var(--ink); }
.hidden-records summary::-webkit-details-marker { display: none; }
.hidden-records[open] summary { margin-bottom: var(--s2); }
.hidden-records .legend { max-width: 36em; }
.hidden-list { list-style: none; margin: var(--s2) 0 0; padding: 0; columns: 2 14rem; column-gap: var(--s5); }
.hidden-list li { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); break-inside: avoid; padding: 2px 0; }
.data-note ul { padding-left: var(--s4); margin: var(--s2) 0 0; max-width: 38em; }
.data-note li { margin-bottom: var(--s1); }

.landing-side { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.trip-entry { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); border-top: 1px solid var(--ink); padding-top: var(--s2); }

.trip-setup { display: flex; flex-direction: column; gap: var(--s3); max-width: 32rem; }
.trip-setup label { display: flex; flex-direction: column; gap: var(--s1); font-weight: 600; }
.trip-setup .trip-row { display: flex; gap: var(--s3); }
.trip-setup .trip-row label { flex: 1; }
.trip-setup .primary { align-self: flex-start; }
.trip-row { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); }
.trip-setup select { width: 100%; min-height: var(--touch); font: inherit; padding: 0 var(--s2); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); color: var(--ink); }
.trip-row select { flex: 1; min-width: 0; min-height: var(--touch); font: inherit; padding: 0 var(--s2); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); color: var(--ink); }
.trip-row span { color: var(--ink-2); font-size: var(--size-s); }
.primary { min-height: var(--touch); padding: 0 var(--s4); border: 0; border-radius: var(--radius); background: var(--ink); color: var(--ground); font-weight: 650; cursor: pointer; }
.primary:hover { background: var(--ink-hover); }
/* Secondary: the Back button's paper and strong hairline, for the quiet choice beside a primary. */
.secondary { min-height: var(--touch); padding: 0 var(--s4); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); cursor: pointer; }

.search { position: relative; }
input::placeholder { color: var(--ink-2); opacity: 1; }
.search input { width: 100%; min-height: var(--touch); font: inherit; padding: 0 var(--s3); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); }
.search-results { list-style: none; margin: 0; padding: 0; }
.search-results:not(:empty) { border: 1px solid var(--rule); border-top: 0; }
.search-results button { width: 100%; display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s2) var(--s3); min-height: var(--touch); border: 0; border-top: 1px solid var(--rule); background: var(--ground); text-align: left; cursor: pointer; }
.search-results button:hover { background: var(--panel); }
.search-results .kind { color: var(--ink-2); font-size: var(--size-xs); }

.list-chooser { display: flex; flex-direction: column; gap: var(--s2); }
.list-chooser h2 { border-bottom: 1px solid var(--ink); padding-bottom: var(--s2); }
.list-chooser .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.list-chooser .chip, .star-menu .chip { max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.list-chooser .count { margin-left: var(--s1); opacity: 0.7; font-variant-numeric: tabular-nums; }
.new-list { display: flex; gap: var(--s2); }

/* Text fields share the search field's look (design review: the list name had no padding). */
.new-list input, .share-status input { flex: 1; min-width: 0; min-height: var(--touch); font: inherit; padding: 0 var(--s3); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); color: var(--ink); }
.star-menu-row { list-style: none; }
main > .shared-list { margin-bottom: var(--s4); }
.shared-list:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
.shared-list { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); border: 1px solid var(--ink); border-radius: var(--radius); }
.share-status { flex-basis: 100%; }
.share-status input { width: 100%; }
.paste-list { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
.paste-list .new-list { align-self: stretch; flex-wrap: wrap; }
.paste-list > .link { font-weight: 400; font-size: var(--size-xs); color: var(--ink-2); } /* quieter than + New list */
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.list-section { display: flex; flex-direction: column; gap: var(--s4); }
.list-hint { color: var(--ink-2); max-width: 42ch; }
.index-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); border-bottom: 1px solid var(--ink); padding-bottom: var(--s2); }
.seg.small button { min-height: 30px; font-size: var(--size-xs); }
.plates { list-style: none; margin: 0; padding: 0; }
.plate-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 3.8rem; grid-template-rows: auto auto; column-gap: var(--s3); align-items: center; padding: var(--s2) 0; border-bottom: 1px solid var(--rule); }
.plate-link { grid-row: 1 / 3; display: flex; flex-direction: column; align-items: flex-start; padding: var(--s1) 0; border: 0; background: none; text-align: left; cursor: pointer; min-height: var(--touch); justify-content: center; }
.plate-link .name { font-weight: 650; }
.plate-link:hover .name { text-decoration: underline; text-underline-offset: 3px; }
.plate-link .sci { font-size: var(--size-xs); }
.now { text-align: right; font-weight: 600; }
.now.proxy, .now.level-thin, .now.level-withheld, .now.level-unknown { color: var(--ink-2); font-weight: 400; font-size: var(--size-xs); }
.best { grid-column: 2 / 4; font-size: var(--size-xs); color: var(--earth); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.monthbars .mb { fill: var(--rate); }
.monthbars .mb.selected { fill: var(--rate-strong); }
.monthbars { display: inline-grid; grid-template-rows: auto auto; width: 132px; vertical-align: middle; }
.monthbars .mb-chart { display: block; width: 100%; height: 22px; }
.mb-axis { display: grid; grid-template-columns: repeat(12, 1fr); margin-top: 2px; font-family: var(--font-figure); font-size: var(--size-axis); line-height: 1; letter-spacing: 0; color: var(--ink-2); text-align: center; }
.mb-axis .on { color: var(--ink); font-weight: 700; }
/* Proxy rates: a pale green bar edged in field green (was a grey hollow outline, design review P1). */
.monthbars .mb.proxy { fill: var(--rate-proxy); stroke: var(--rate); stroke-width: 1; vector-effect: non-scaling-stroke; }
.monthbars .mb.proxy.selected { fill: var(--rate); stroke: var(--rate-strong); stroke-width: 2; } /* the chosen month fills solid (design review 2) */
.monthbars .mb.thin { fill: #d6d1c2; }
.monthbars .mb.unpulled, .weekstrip .wk.unpulled { fill: url(#unpulled-hatch); stroke: #8a857a; stroke-width: 1; vector-effect: non-scaling-stroke; }
.monthbars .mb.none { stroke: var(--rule-strong); stroke-width: 1.5; stroke-dasharray: 2 2; }

@media (max-width: 1024px) {
  .landing { grid-template-columns: minmax(0, 1fr); }
  .statemap { max-height: none; }
}
@media (max-width: 720px) {
  .trip-row { flex-wrap: wrap; }
  .trip-row .primary { flex-basis: 100%; }
  .plate-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; }
  .plate-link { grid-row: 1; grid-column: 1; }
  .plate-row .now { grid-row: 1; grid-column: 2; }
  .plate-row .monthbars { grid-row: 2; grid-column: 1 / 3; width: 100%; }
  .plate-row .best { grid-row: 3; grid-column: 1 / 3; text-align: left; white-space: normal; }
  .index-head { flex-wrap: wrap; }
}
.plate-row > * { min-width: 0; }
.landing > * { min-width: 0; }

/* ---------- species plate ---------- */
.kind { margin-left: auto; font-size: var(--size-xs); color: var(--ink-2); }
.headline { font-size: var(--size-l); line-height: 1.35; max-width: 35em; margin: 0 0 var(--s5); text-wrap: pretty; }
.headline.level-low { color: var(--ink-2); }
.strips { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); padding: var(--s3) 0; margin-bottom: var(--s5); display: grid; gap: var(--s2); }
.years { display: flex; gap: 3px; flex-wrap: wrap; align-items: flex-end; }
@media (min-width: 721px) {
  /* Fifteen years on one line: the year cells shrink rather than wrap (design review). */
  .years { flex-wrap: nowrap; min-width: 0; }
  .plate-summary > * { min-width: 0; }
  .years .year { flex: 1 1 0; min-width: 0; max-width: 36px; }
}
.years-label { font-size: var(--size-xs); color: var(--ink-2); margin-right: var(--s2); align-self: center; }
.year { display: grid; grid-template-rows: 26px auto; align-items: end; justify-items: center; width: 36px; padding: 2px 0; border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer; }
.year[aria-pressed="true"] { border-color: var(--ink); }
.year .bar { width: 14px; height: calc(var(--step) * 3px + 1px); background: var(--rate); }
.year .yr { font-size: var(--size-xs); color: var(--ink-2); }
.weekstrip { width: 100%; height: auto; display: block; }
.weekstrip .wk { fill: var(--rate); cursor: pointer; }
.weekstrip .wk.selected { fill: var(--rate-strong); }
.weekstrip .wk.proxy { fill: var(--rate-proxy); stroke: var(--rate); stroke-width: 1; vector-effect: non-scaling-stroke; }
.weekstrip .wk.thin { fill: #d6d1c2; }
.weekstrip .wk.none { stroke: var(--rule-strong); stroke-width: 2; stroke-dasharray: 3 3; }
.wk-axis { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); font: var(--size-xs)/1.6 var(--font-figure); color: var(--ink-2); text-align: center; }
.wk-axis .on { color: var(--ink); font-weight: 700; }
.weekstrip .wk-rule { stroke: var(--rule); stroke-width: 1; }
/* The map leads (spot check, 3.5d): the wider column, pinned in view while the table scrolls. */
.plate-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-col);
  grid-template-areas: "map summary" "map side"; grid-template-rows: auto 1fr; gap: 0 var(--s6); align-items: start; }
.plate-map { grid-area: map; position: sticky; top: var(--header-h, 120px); }
.plate-summary { grid-area: summary; }
.plate-side { grid-area: side; }
.plate-map .statemap { max-height: calc(100vh - var(--header-h, 120px) - 110px); }
.plate-body > * { min-width: 0; }
.statemap .mark.thin, .legend-statemap .mark.thin { fill: #d6d1c2; stroke: #8a857a; stroke-width: 0.6; stroke-dasharray: none; }
.statemap .mark.proxy, .legend-statemap .mark.proxy { fill: var(--rate-proxy); stroke: var(--rate); stroke-width: 1; }
.statemap .mark.outside, .legend-statemap .mark.outside { opacity: 0.25; }
.statemap .hatch-line { stroke: #8a857a; stroke-width: 1.6; }
.plate-side { display: grid; gap: var(--s5); }
.best-table table { width: 100%; border-collapse: collapse; font-size: var(--size-s); }
.best-table th { text-align: left; font-size: var(--size-xs); color: var(--ink-2); font-weight: 600; padding: var(--s1) var(--s2); border-bottom: 1px solid var(--ink); }
.best-table td { padding: var(--s2); border-bottom: 1px solid var(--rule); vertical-align: middle; }
.place-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.link { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--ink); }
.access { font-size: var(--size-xs); color: var(--ink-2); }
.access-restricted, .access-view_only { color: var(--earth); }
.access-unknown { color: var(--alert); }
.rate-cell { display: flex; align-items: center; gap: var(--s2); white-space: nowrap; }
.rate-track { display: inline-block; width: 72px; height: 8px; background: #ebe7dc; position: relative; }
.rate-fill { position: absolute; inset: 0 auto 0 0; background: var(--rate); }
.rate-track.proxy .rate-fill { background: var(--rate-proxy); box-shadow: inset 0 0 0 1px var(--rate); }
.thin-chip { display: inline-block; padding: 1px 6px; background: #ece8dc; border: 1px solid var(--rule); font-size: var(--size-xs); color: var(--ink-2); }
.sample { color: var(--ink-2); font-size: var(--size-xs); white-space: nowrap; }
.hidden-line { max-width: 36em; font-size: var(--size-s); padding-top: var(--s2); border-top: 1px solid var(--rule); color: var(--ink-2); margin: 0; }
.context-band ul, .field-notes { font-size: var(--size-s); }
.context-band ul { padding-left: var(--s4); margin: var(--s2) 0 0; }
.field-notes p { max-width: 32em; }
.field-notes .src { color: var(--ink-2); font-size: var(--size-xs); }
.withheld-note { color: var(--alert); }
@media (max-width: 1024px) { .plate-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "summary" "map" "side"; gap: var(--s5); } .plate-map { position: static; } .kind { margin-left: 0; } }
.weekstrip { height: 64px; }
@media (max-width: 720px) {
  .weekstrip { height: 48px; }
  .best-table thead { display: none; }
  .best-table table, .best-table tbody { display: block; }
  .best-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--rule); }
  .best-table td { display: block; border: 0; padding: 2px 0; min-width: 0; }
  .best-table td:first-child { grid-column: 1 / 3; }
  .best-table .sample { text-align: right; align-self: center; }
  .headline { font-size: var(--size-m); }
}

/* ---------- place page ---------- */
.facts { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: baseline; color: var(--ink-2); margin: 0 0 var(--s5); max-width: 48em; }
.facts .dot { color: var(--rule-strong); }
.facts .note { flex-basis: 100%; font-size: var(--size-s); }
.access-badge { font-weight: 650; color: var(--ink); }
.access-badge.access-restricted, .access-badge.access-view_only { color: var(--earth); }
.access-badge.access-unknown { color: var(--alert); }
.place-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-col); gap: var(--s6); align-items: start; }
.place-map { position: sticky; top: var(--header-h, 120px); }
.place-body > * { min-width: 0; }
.placemap { width: 100%; height: auto; max-height: calc(100vh - var(--header-h, 120px) - 140px); display: block; background: var(--sea-tint); border: 1px solid var(--rule); }
.placemap .land { fill: var(--land); stroke: var(--rule-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
.placemap .land.focus { fill: #f6f3ea; stroke: var(--ink-2); stroke-width: 1.5; }
.placemap .sea { fill: var(--sea-tint); }
/* County view: the county in paper with an ink edge; a veil darkens everything outside it
   (land, sea and places alike), so the county reads first (owner request, 2026-09-28). */
.placemap.county-view .land.focus { fill: var(--ground); stroke: var(--ink); stroke-width: 2; }
.placemap.county-view .site.context, .placemap.county-view .access-hatch.context { opacity: 0.25; }
.placemap .site.inert, .legend-placemap .site.inert { pointer-events: none; }
.placemap .jump { cursor: pointer; }
.placemap .land.jump:focus-visible { outline: none; stroke: var(--sea); stroke-width: 2.6; }
.placemap .county-veil, .legend-placemap .county-veil { fill: #5f5a50; fill-opacity: 0.5; stroke: none; pointer-events: none; }
/* Site types (logic/sitekind.js): one outline colour each; green stays reserved for rate. */
.placemap .site, .legend-placemap .site { fill: rgba(85, 82, 75, 0.08); stroke: var(--ink-2); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }
.placemap .site.kind-national, .legend-placemap .site.kind-national { fill: var(--kind-national-tint); stroke: var(--kind-national); stroke-width: 1.6; }
.placemap .site.kind-state, .legend-placemap .site.kind-state { fill: var(--kind-state-tint); stroke: var(--kind-state); stroke-width: 1.6; }
.placemap .site.kind-wildlife, .legend-placemap .site.kind-wildlife { fill: rgba(122, 92, 51, 0.14); stroke: var(--earth); }
.placemap .site.kind-marine, .legend-placemap .site.kind-marine { fill: rgba(42, 90, 128, 0.12); stroke: var(--sea); stroke-dasharray: 5 3; }
.placemap .site.kind-federal, .legend-placemap .site.kind-federal { fill: rgba(138, 133, 122, 0.06); stroke: var(--kind-federal); stroke-width: 0.8; stroke-dasharray: 2 2; }
.placemap .site.kind-local, .legend-placemap .site.kind-local { fill: rgba(85, 82, 75, 0.06); stroke: var(--ink-2); stroke-width: 1; }
.kind-key { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin: var(--s2) 0 0; padding: 0; list-style: none; font-size: var(--size-xs); color: var(--ink-2); }
.kind-key li { display: inline-flex; align-items: center; gap: var(--s1); }
.kind-key .swatch { width: 16px; height: 10px; border: 1.5px solid var(--ink-2); background: rgba(85, 82, 75, 0.06); }
.kind-key .swatch.kind-national { border-color: var(--kind-national); background: var(--kind-national-tint); }
.kind-key .swatch.kind-state { border-color: var(--kind-state); background: var(--kind-state-tint); }
.kind-key .swatch.kind-wildlife { border-color: var(--earth); background: rgba(122, 92, 51, 0.14); }
.kind-key .swatch.kind-marine { border-color: var(--sea); border-style: dashed; background: rgba(42, 90, 128, 0.12); }
.kind-key .swatch.kind-federal { border-color: var(--kind-federal); border-style: dashed; border-width: 1px; }
/* Restricted and view-only access: a cross-hatch over the type colour (not the single diagonal
   used for not-yet-pulled data). */
.placemap .access-hatch, .legend-placemap .access-hatch { pointer-events: none; }
.placemap .access-hatch.context, .legend-placemap .access-hatch.context { opacity: 0.35; }
.placemap .hatch-x, .legend-placemap .hatch-x { stroke: var(--ink-2); stroke-opacity: 0.55; fill: none; }
.placemap .site.closed, .legend-placemap .site.closed { cursor: default; }
.kind-key .swatch.hatch-x-swatch { border-color: var(--ink-2); background:
  repeating-linear-gradient(45deg, var(--ink-2) 0 1px, transparent 1px 4px),
  repeating-linear-gradient(-45deg, var(--ink-2) 0 1px, transparent 1px 4px); opacity: 0.8; }
.open-toggle { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin: var(--s2) 0; }
.placemap .site.context, .legend-placemap .site.context { opacity: 0.35; }
.placemap .site:hover { stroke-width: 2.4; }
/* This place, on its own map: an earth edge over its type's tint, as on the local map. */
.placemap .site.here, .legend-placemap .site.here { stroke: var(--earth); stroke-width: 2.4; stroke-dasharray: none; }
.placemap .site.selected, .legend-placemap .site.selected { stroke: var(--ink); stroke-width: 2.6; stroke-dasharray: none; fill: rgba(31, 30, 27, 0.14); opacity: 1; }
.placemap .site:focus-visible, .legend-placemap .site:focus-visible { outline: none; stroke: var(--sea); stroke-width: 2.6; }
.map-pick { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); min-height: var(--touch); margin: var(--s2) 0 0; }
.map-pick .hint, .map-pick .pick-meta { font-size: var(--size-s); color: var(--ink-2); }
.map-pick .pick-name { font-weight: 650; }
.place-side { display: grid; gap: var(--s5); }
.list-controls { display: grid; gap: var(--s2); margin: var(--s3) 0 var(--s2); justify-items: start; }
.list-controls input { justify-self: stretch; }
.list-controls input { min-height: 40px; font: inherit; padding: 0 var(--s3); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
.chip { display: inline-flex; align-items: center; gap: var(--s1); min-height: 32px; padding: 0 var(--s3); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); font-size: var(--size-xs); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.species-row { grid-template-columns: auto minmax(0, 1fr) auto 5.5rem; grid-template-rows: auto; }
.species-row .now-cell, .field-row .now-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.now-cell .sample { font-size: var(--size-xs); font-family: var(--font-figure); }
.place-figure { white-space: nowrap; }
.species-row .plate-link { grid-row: auto; }
.star { display: inline-grid; place-items: center; width: var(--touch); height: var(--touch); border: 0; background: none; color: var(--ink-2); cursor: pointer; }
.star.on { color: var(--earth); }
.star.blank { cursor: default; }
/* The star's list menu opens under its row, across the full width. */
.star-menu { grid-column: 1 / -1; display: flex; flex-direction: column; gap: var(--s2); margin: var(--s2) 0; padding: var(--s3); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); }
.plate-head .star { align-self: center; }
.plate-head .star-menu { flex-basis: 100%; max-width: 32rem; }
.star-menu .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.star.on .icon path, .chip[aria-pressed="true"] .star-icon path, .likely .star-icon path { fill: currentColor; }
.count { margin: 0; }
@media (max-width: 1024px) { .place-body { grid-template-columns: minmax(0, 1fr); } .place-map { position: static; } .placemap { max-height: 60vh; } }
@media (max-width: 720px) {
  .plate-row.species-row { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto; }
  .species-row .star { grid-row: 1 / 3; grid-column: 1; }
  .species-row .plate-link { grid-row: 1; grid-column: 2; }
  .species-row .now-cell { grid-row: 1; grid-column: 3; }
  .species-row .monthbars { grid-row: 2; grid-column: 2 / 4; width: 100%; }
}

/* ---------- trip window ---------- */
.trip-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin: 0 0 var(--s5); }
.trip-controls select { min-height: var(--touch); font: inherit; padding: 0 var(--s2); border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--ground); max-width: 100%; }
.trip-controls span { color: var(--ink-2); }
.trip-table .expected .figure { font-size: var(--size-l); font-weight: 700; }
.trip-table .expected { white-space: nowrap; }

/* ---------- phone touch targets (AC7: at least 44 px) and compact header ---------- */
@media (max-width: 720px) {
  .shell-header { gap: var(--s2); }

  /* The time controls fold into one button; open, they are a grid, never a sideways scroll. */
  /* Row 1: Back and where you are. Row 2: the time button and the data button. Row 3: the

  .shell-header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; }
  .shell-header .back { grid-column: 1; grid-row: 1; }
  .shell-header .trail { grid-column: 2 / 4; grid-row: 1; }
  /* Notes at the end of the first row, so the time button keeps its width (data-notes). */

  .time-toggle { grid-column: 1 / 4; grid-row: 2; justify-content: space-between; }
  .shell-header .device-button { grid-column: 4; grid-row: 2; }
  .shell-header:not(:has(.device-button)) .time-toggle { grid-column: 1 / -1; }
  .shell-header .time { grid-column: 1 / -1; grid-row: 3; }

  .seg button, .seg.small button { min-height: var(--touch); }

  .link { display: inline-flex; align-items: center; min-height: var(--touch); }
  .year { min-height: var(--touch); width: var(--touch); }
  .data-note summary { display: flex; align-items: center; min-height: var(--touch); }
